[project]
name = "vespera-api"
version = "0.1.0"
description = "Vespera AI FastAPI backend (Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-multipart==0.0.20",
    # Auth / JWT
    "pyjwt==2.10.1",
    "cryptography==44.0.0",
    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "supabase==2.11.0",
    # Vector DB
    "qdrant-client==1.12.2",
    # AI (single-worker triage agent)
    "google-genai==0.4.0",
    # Document parsing for RAG ingestion
    "pypdf==5.1.0",
    "langchain-text-splitters==0.3.4",
    # Utilities
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "tzdata==2024.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "respx==0.22.0",
    "aiosqlite==0.20.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
]

[tool.uv]
# Application project — uv manages the environment but does not build/install
# `vespera-api` itself (the app runs via `uvicorn app.main:app`).
package = false

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
concurrency = ["thread", "greenlet"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
